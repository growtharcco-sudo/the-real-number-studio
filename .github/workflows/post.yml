name: Post due Reels

on:
  schedule:
    - cron: "35 15 * * *"     # 9:05 PM IST   (evening slot, mid-March to early Nov)
    - cron: "35 16 * * *"     # 10:05 PM IST  (evening slot, early Nov to mid-March)
    - cron: "35 2 * * *"      # 08:05 AM IST  (morning slot, if one is queued)
  workflow_dispatch:           # "Run workflow" button for a manual post or a test
  push:
    branches: [main]
    paths: ["queue/**"]       # posts straight away if something was queued already due

concurrency: { group: post, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests google-api-python-client google-auth
      - name: Post
        id: post
        continue-on-error: true
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: python poster/publish_due.py
      - name: Save results
        run: |
          git config user.name trn-bot && git config user.email trn-bot@users.noreply.github.com
          git add -A queue posted && git commit -q -m "posting results" && git push -q || echo "nothing to save"
          python poster/media_branch.py prune
      - name: Fail loudly so GitHub emails you
        if: steps.post.outcome == 'failure'
        run: exit 1

  refresh-instagram-token:     # long-lived tokens expire after 60 days; refresh every Monday
    if: github.event.schedule == '35 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Refresh and store
        env: { IG_TOKEN: "${{ secrets.IG_TOKEN }}", GH_TOKEN: "${{ secrets.GH_PAT }}" }
        run: |
          [ "$(date -u +%u)" = "1" ] || exit 0
          [ -n "$GH_TOKEN" ] || { echo "GH_PAT not set, skipping refresh"; exit 0; }
          case "$IG_TOKEN" in EAA*) echo "Facebook-type token, no refresh needed"; exit 0;; esac
          NEW=$(python -c "import os,sys; sys.path.insert(0,'poster'); import instagram; print(instagram.refresh_token(os.environ['IG_TOKEN']))")
          gh secret set IG_TOKEN --body "$NEW" --repo "${{ github.repository }}"
